<script>
  (() => {
    const state = {
      institutionName: 'CENMA Brigadier J. I. San Martín Anexo Sacchi',
      systemTitle: 'Sistema de votación',
      logoUrl: '',
      status: 'closed',
      estimatedOpening: '',
      showResults: false,
      stands: [],
      selectedStandId: '',
      hasVoted: false,
      ...window.INITIAL_STATE,
    };

    const statusLabels = {
      draft: 'Votación cerrada',
      open: 'Votación abierta',
      closed: 'Votación cerrada',
    };

    const elements = {
      institutionName: document.querySelector('#institutionName'),
      systemTitle: document.querySelector('#systemTitle'),
      institutionLogo: document.querySelector('#institutionLogo'),
      logoFallback: document.querySelector('#logoFallback'),
      votingStatus: document.querySelector('#votingStatus'),
      statusText: document.querySelector('#statusText'),
      estimatedOpening: document.querySelector('#estimatedOpening'),
      estimatedOpeningText: document.querySelector('#estimatedOpeningText'),
      standGrid: document.querySelector('#standGrid'),
      standCount: document.querySelector('#standCount'),
      emptyState: document.querySelector('#emptyState'),
      cardTemplate: document.querySelector('#standCardTemplate'),
      selectedStandName: document.querySelector('#selectedStandName'),
      confirmVoteButton: document.querySelector('#confirmVoteButton'),
      photoDialog: document.querySelector('#photoDialog'),
      photoDialogMedia: document.querySelector('#photoDialogMedia'),
      photoDialogTitle: document.querySelector('#photoDialogTitle'),
      selectFromPhotoButton: document.querySelector('#selectFromPhotoButton'),
      confirmVoteDialog: document.querySelector('#confirmVoteDialog'),
      confirmVoteTitle: document.querySelector('#confirmVoteTitle'),
      confirmVoteText: document.querySelector('#confirmVoteText'),
      submitVoteButton: document.querySelector('#submitVoteButton'),
      cancelVoteButton: document.querySelector('#cancelVoteButton'),
      voteMessage: document.querySelector('#voteMessage'),
      resultsLink: document.querySelector('#resultsLink'),
      adminDialog: document.querySelector('#adminDialog'),
      adminLoginView: document.querySelector('#adminLoginView'),
      pinForm: document.querySelector('#pinForm'),
      adminPin: document.querySelector('#adminPin'),
      pinMessage: document.querySelector('#pinMessage'),
      adminPanel: document.querySelector('#adminPanel'),
      adminStatus: document.querySelector('#adminStatus'),
      adminVoteCount: document.querySelector('#adminVoteCount'),
      adminPhotoCount: document.querySelector('#adminPhotoCount'),
      openVotingButton: document.querySelector('#openVotingButton'),
      closeVotingButton: document.querySelector('#closeVotingButton'),
      openingTimeForm: document.querySelector('#openingTimeForm'),
      adminOpeningTime: document.querySelector('#adminOpeningTime'),
      resetVotingButton: document.querySelector('#resetVotingButton'),
      emptyStandsButton: document.querySelector('#emptyStandsButton'),
      adminLogoutButton: document.querySelector('#adminLogoutButton'),
      adminMessage: document.querySelector('#adminMessage'),
      dangerDialog: document.querySelector('#dangerDialog'),
      dangerDialogTitle: document.querySelector('#dangerDialogTitle'),
      dangerDialogText: document.querySelector('#dangerDialogText'),
      dangerForm: document.querySelector('#dangerForm'),
      dangerPin: document.querySelector('#dangerPin'),
      dangerMessage: document.querySelector('#dangerMessage'),
      confirmDangerButton: document.querySelector('#confirmDangerButton'),
      cancelDangerButton: document.querySelector('#cancelDangerButton'),
    };

    let activePhotoStand = null;
    let adminToken = getStoredAdminToken();
    let pendingDangerAction = '';

    function renderApp() {
      elements.institutionName.textContent = state.institutionName;
      elements.systemTitle.textContent = state.systemTitle;
      document.title = `${state.systemTitle} · ${state.institutionName}`;
      renderLogo();
      renderVotingStatus();
      renderResultsLink();
      renderStands(Array.isArray(state.stands) ? state.stands : []);
      renderSelection();
    }

    function applyPublicState(publicState) {
      if (!publicState) return;
      Object.assign(state, publicState);
      renderApp();
    }

    function renderVotingStatus() {
      const isOpen = state.status === 'open';
      const estimatedOpening = String(state.estimatedOpening || '').trim();

      elements.votingStatus.dataset.status = state.status;
      elements.statusText.textContent = statusLabels[state.status] || statusLabels.closed;
      elements.estimatedOpening.hidden = isOpen;
      elements.estimatedOpeningText.textContent = estimatedOpening || 'Horario a confirmar';
    }

    function renderResultsLink() {
      elements.resultsLink.hidden = !state.showResults;
    }

    function renderLogo() {
      if (!state.logoUrl) {
        elements.institutionLogo.hidden = true;
        elements.logoFallback.hidden = false;
        return;
      }

      if (elements.institutionLogo.src === state.logoUrl && !elements.institutionLogo.hidden) {
        return;
      }

      elements.institutionLogo.addEventListener('load', () => {
        elements.institutionLogo.hidden = false;
        elements.logoFallback.hidden = true;
      }, { once: true });

      elements.institutionLogo.addEventListener('error', () => {
        elements.institutionLogo.hidden = true;
        elements.logoFallback.hidden = false;
      }, { once: true });

      elements.institutionLogo.src = state.logoUrl;
      elements.institutionLogo.alt = `Logo de ${state.institutionName}`;
    }

    function renderStands(stands) {
      elements.standGrid.replaceChildren();
      elements.standCount.textContent = `${stands.length} ${stands.length === 1 ? 'stand' : 'stands'}`;
      elements.emptyState.hidden = stands.length > 0;
      elements.standGrid.hidden = stands.length === 0;

      stands.forEach((stand, index) => {
        const fragment = elements.cardTemplate.content.cloneNode(true);
        const card = fragment.querySelector('.stand-card');
        const mediaButton = fragment.querySelector('.stand-card__media');
        const number = fragment.querySelector('.stand-card__number');
        const title = fragment.querySelector('.stand-card__title');
        const standNumber = Number(stand.number);
        const displayNumber = Number.isInteger(standNumber) && standNumber > 0
          ? String(standNumber).padStart(2, '0')
          : String(index + 1).padStart(2, '0');

        card.dataset.standId = stand.id;
        title.textContent = stand.name;
        mediaButton.setAttribute('aria-label', `Ampliar imagen de ${stand.name}`);

        if (stand.imageUrl) {
          const image = document.createElement('img');
          image.src = stand.imageUrl;
          image.alt = `Foto de ${stand.name}`;
          image.loading = 'lazy';
          number.replaceWith(image);
        } else {
          number.textContent = displayNumber;
        }

        mediaButton.addEventListener('click', () => openPhoto(stand, displayNumber));
        elements.standGrid.appendChild(fragment);
      });
    }

    function openPhoto(stand, displayNumber) {
      activePhotoStand = stand;
      elements.photoDialogMedia.replaceChildren();
      elements.photoDialogTitle.textContent = stand.name;

      if (stand.imageUrl) {
        const image = document.createElement('img');
        image.src = stand.imageUrl;
        image.alt = `Foto ampliada de ${stand.name}`;
        elements.photoDialogMedia.appendChild(image);
      } else {
        const number = document.createElement('span');
        number.textContent = displayNumber;
        elements.photoDialogMedia.appendChild(number);
      }

      const canSelect = state.status === 'open' && !state.hasVoted;
      elements.selectFromPhotoButton.disabled = !canSelect;
      elements.selectFromPhotoButton.textContent = canSelect
        ? state.selectedStandId === stand.id
          ? 'Stand seleccionado'
          : 'Seleccionar este stand'
        : state.hasVoted
          ? 'Voto ya registrado'
          : 'La votación no está abierta';

      elements.photoDialog.showModal();
    }

    function selectActivePhotoStand() {
      if (!activePhotoStand || state.status !== 'open' || state.hasVoted) return;
      state.selectedStandId = activePhotoStand.id;
      elements.photoDialog.close();
      renderSelection();
    }

    function renderSelection() {
      const selectedStand = getSelectedStand();

      elements.standGrid.querySelectorAll('.stand-card').forEach((card) => {
        const isSelected = card.dataset.standId === state.selectedStandId;
        card.classList.toggle('is-selected', isSelected);
        card.querySelector('.stand-card__selected').hidden = !isSelected;
      });

      if (state.hasVoted) {
        elements.selectedStandName.textContent = selectedStand
          ? `Voto registrado: ${selectedStand.name}`
          : 'Este dispositivo ya registró su voto';
        elements.confirmVoteButton.textContent = 'Voto registrado';
        elements.confirmVoteButton.disabled = true;
        return;
      }

      elements.selectedStandName.textContent = selectedStand
        ? selectedStand.name
        : 'Todavía no elegiste un stand';
      elements.confirmVoteButton.textContent = 'Confirmar voto';
      elements.confirmVoteButton.disabled = !selectedStand || state.status !== 'open';
    }

    function getSelectedStand() {
      return state.stands.find((stand) => stand.id === state.selectedStandId) || null;
    }

    function openVoteConfirmation() {
      const selectedStand = getSelectedStand();
      if (!selectedStand || state.status !== 'open' || state.hasVoted) return;

      elements.confirmVoteTitle.textContent = 'Confirmá tu voto';
      elements.confirmVoteText.textContent = `Vas a votar por ${selectedStand.name}. Esta acción no se puede deshacer.`;
      setMessage(elements.voteMessage, '');
      elements.submitVoteButton.hidden = false;
      elements.submitVoteButton.disabled = false;
      elements.submitVoteButton.textContent = 'Sí, confirmar voto';
      elements.cancelVoteButton.textContent = 'Volver';
      elements.confirmVoteDialog.showModal();
    }

    async function submitVote() {
      const selectedStand = getSelectedStand();
      if (!selectedStand || state.hasVoted) return;

      elements.submitVoteButton.disabled = true;
      elements.submitVoteButton.textContent = 'Registrando…';
      setMessage(elements.voteMessage, '');

      try {
        const result = await callServer('registerVote', {
          standId: selectedStand.id,
          deviceId: getDeviceId(),
        });
        handleVoteResult(result);
      } catch (error) {
        showVoteError(error.message || 'No pudimos registrar el voto. Intentá nuevamente.');
      }
    }

    function handleVoteResult(result) {
      if (!result || !result.ok) {
        if (result && result.alreadyVoted) {
          state.hasVoted = true;
          elements.confirmVoteTitle.textContent = 'Voto ya registrado';
          elements.confirmVoteText.textContent = result.message;
          setMessage(elements.voteMessage, '');
          elements.submitVoteButton.hidden = true;
          elements.cancelVoteButton.textContent = 'Cerrar';
          renderSelection();
          return;
        }

        showVoteError(result && result.message
          ? result.message
          : 'No pudimos registrar el voto. Intentá nuevamente.');
        return;
      }

      state.hasVoted = true;
      elements.confirmVoteTitle.textContent = '¡Voto registrado!';
      elements.confirmVoteText.textContent = result.message;
      setMessage(elements.voteMessage, 'Gracias por participar.', 'success');
      elements.submitVoteButton.hidden = true;
      elements.cancelVoteButton.textContent = 'Cerrar';
      renderSelection();
    }

    function showVoteError(message) {
      setMessage(elements.voteMessage, message, 'error');
      elements.submitVoteButton.disabled = false;
      elements.submitVoteButton.textContent = 'Intentar nuevamente';
    }

    async function openAdminDialog() {
      setMessage(elements.pinMessage, '');
      setMessage(elements.adminMessage, '');
      elements.adminDialog.showModal();

      if (!adminToken) {
        showAdminLogin();
        window.setTimeout(() => elements.adminPin.focus(), 50);
        return;
      }

      showAdminLoading();
      try {
        const adminState = await callServer('getAdminState', adminToken);
        showAdminPanel(adminState);
      } catch (error) {
        clearAdminToken();
        showAdminLogin(error.message);
      }
    }

    async function submitAdminPin(event) {
      event.preventDefault();
      const pin = elements.adminPin.value.trim();
      setMessage(elements.pinMessage, 'Comprobando…');
      setFormBusy(elements.pinForm, true);

      try {
        const result = await callServer('authenticateAdmin', {
          pin,
          deviceId: getDeviceId(),
        });
        adminToken = result.token;
        storeAdminToken(adminToken);
        elements.adminPin.value = '';
        showAdminPanel(result.adminState);
      } catch (error) {
        setMessage(elements.pinMessage, error.message, 'error');
      } finally {
        setFormBusy(elements.pinForm, false);
      }
    }

    function showAdminLoading() {
      elements.adminLoginView.hidden = false;
      elements.adminPanel.hidden = true;
      elements.pinForm.hidden = true;
      setMessage(elements.pinMessage, 'Cargando el panel…');
    }

    function showAdminLogin(message = '') {
      elements.adminLoginView.hidden = false;
      elements.adminPanel.hidden = true;
      elements.pinForm.hidden = false;
      setMessage(elements.pinMessage, message, message ? 'error' : '');
    }

    function showAdminPanel(adminState) {
      elements.adminLoginView.hidden = true;
      elements.adminPanel.hidden = false;
      setMessage(elements.adminMessage, '');
      renderAdminState(adminState);
    }

    function renderAdminState(adminState) {
      if (!adminState) return;
      const isOpen = adminState.status === 'open';
      elements.adminStatus.textContent = isOpen ? 'Abierta' : 'Cerrada';
      elements.adminStatus.dataset.status = adminState.status;
      elements.adminVoteCount.textContent = String(adminState.voteCount || 0);
      elements.adminPhotoCount.textContent = String(adminState.photoCount || 0);
      elements.adminOpeningTime.value = adminState.estimatedOpening || '';
      elements.openVotingButton.disabled = isOpen;
      elements.closeVotingButton.disabled = !isOpen;

      state.status = adminState.status;
      state.estimatedOpening = adminState.estimatedOpening || '';
      state.showResults = Boolean(adminState.showResults);
      renderVotingStatus();
      renderResultsLink();
      renderSelection();
    }

    async function changeVotingStatus(status) {
      setAdminBusy(true);
      setMessage(elements.adminMessage, status === 'open' ? 'Abriendo…' : 'Cerrando…');
      try {
        const result = await callServer('setVotingStatus', { token: adminToken, status });
        applyAdminActionResult(result);
      } catch (error) {
        handleAdminError(error);
      } finally {
        setAdminBusy(false);
      }
    }

    async function saveOpeningTime(event) {
      event.preventDefault();
      setAdminBusy(true);
      setMessage(elements.adminMessage, 'Guardando horario…');
      try {
        const result = await callServer('updateOpeningTime', {
          token: adminToken,
          openingTime: elements.adminOpeningTime.value,
        });
        applyAdminActionResult(result);
      } catch (error) {
        handleAdminError(error);
      } finally {
        setAdminBusy(false);
      }
    }

    function openDangerConfirmation(action) {
      pendingDangerAction = action;
      elements.dangerPin.value = '';
      setMessage(elements.dangerMessage, '');

      if (action === 'resetVoting') {
        elements.dangerDialogTitle.textContent = 'Reiniciar la votación';
        elements.dangerDialogText.textContent =
          'Los votos actuales se copiarán a Historial_Votos y luego se vaciará la hoja Votos. Los stands y sus fotos se conservarán.';
        elements.confirmDangerButton.textContent = 'Archivar y reiniciar';
      } else {
        elements.dangerDialogTitle.textContent = 'Vaciar los stands';
        elements.dangerDialogText.textContent =
          'Se archivarán los votos y los stands. Las fotos activas se moverán a una nueva subcarpeta dentro de Archivadas.';
        elements.confirmDangerButton.textContent = 'Archivar y vaciar';
      }

      elements.dangerDialog.showModal();
      window.setTimeout(() => elements.dangerPin.focus(), 50);
    }

    async function confirmDangerAction(event) {
      event.preventDefault();
      if (!pendingDangerAction) return;

      setFormBusy(elements.dangerForm, true);
      setMessage(elements.dangerMessage, 'Procesando…');
      try {
        const result = await callServer(pendingDangerAction, {
          token: adminToken,
          pin: elements.dangerPin.value.trim(),
        });
        elements.dangerDialog.close();
        pendingDangerAction = '';
        applyAdminActionResult(result);
      } catch (error) {
        const message = error && error.message
          ? error.message
          : 'No se pudo completar la acción.';
        if (message.toLowerCase().includes('sesión')) {
          elements.dangerDialog.close();
          pendingDangerAction = '';
          clearAdminToken();
          showAdminLogin(message);
        } else {
          setMessage(elements.dangerMessage, message, 'error');
        }
      } finally {
        setFormBusy(elements.dangerForm, false);
      }
    }

    function applyAdminActionResult(result) {
      if (result.publicState) applyPublicState(result.publicState);
      if (result.adminState) renderAdminState(result.adminState);
      setMessage(elements.adminMessage, result.message || 'Cambio guardado.', 'success');
    }

    function handleAdminError(error) {
      const message = error && error.message ? error.message : 'No se pudo completar la acción.';
      if (message.toLowerCase().includes('sesión')) {
        clearAdminToken();
        showAdminLogin(message);
        return;
      }
      setMessage(elements.adminMessage, message, 'error');
    }

    async function logoutAdmin() {
      const token = adminToken;
      clearAdminToken();
      showAdminLogin();
      if (token) {
        try {
          await callServer('logoutAdmin', token);
        } catch (error) {
          // La sesión local ya quedó cerrada aunque el servidor no responda.
        }
      }
    }

    function setAdminBusy(isBusy) {
      elements.adminPanel.querySelectorAll('button, input').forEach((control) => {
        control.disabled = isBusy;
      });

      if (!isBusy) {
        const isOpen = state.status === 'open';
        elements.openVotingButton.disabled = isOpen;
        elements.closeVotingButton.disabled = !isOpen;
      }
    }

    function setFormBusy(form, isBusy) {
      form.querySelectorAll('button, input').forEach((control) => {
        control.disabled = isBusy;
      });
    }

    function setMessage(element, message, stateName = '') {
      element.textContent = message || '';
      element.dataset.state = stateName;
    }

    function getStoredAdminToken() {
      try {
        return window.sessionStorage.getItem('stand-voting-admin-token') || '';
      } catch (error) {
        return '';
      }
    }

    function storeAdminToken(token) {
      try {
        window.sessionStorage.setItem('stand-voting-admin-token', token);
      } catch (error) {
        // La sesión seguirá activa mientras esta página permanezca abierta.
      }
    }

    function clearAdminToken() {
      adminToken = '';
      try {
        window.sessionStorage.removeItem('stand-voting-admin-token');
      } catch (error) {
        // No hay almacenamiento disponible para limpiar.
      }
    }

    function getDeviceId() {
      const storageKey = 'stand-voting-device-id';
      try {
        const storedId = window.localStorage.getItem(storageKey);
        if (storedId) return storedId;

        const newId = window.crypto && typeof window.crypto.randomUUID === 'function'
          ? window.crypto.randomUUID()
          : `device-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
        window.localStorage.setItem(storageKey, newId);
        return newId;
      } catch (error) {
        return `device-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
      }
    }

    function callServer(method, ...args) {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error('Esta función solo está disponible desde la aplicación publicada.'));
          return;
        }

        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) => reject(new Error(
            error && error.message ? error.message : 'No se pudo completar la operación.'
          )));

        const methods = {
          registerVote: () => runner.registerVote(...args),
          authenticateAdmin: () => runner.authenticateAdmin(...args),
          getAdminState: () => runner.getAdminState(...args),
          logoutAdmin: () => runner.logoutAdmin(...args),
          setVotingStatus: () => runner.setVotingStatus(...args),
          updateOpeningTime: () => runner.updateOpeningTime(...args),
          resetVoting: () => runner.resetVoting(...args),
          emptyStands: () => runner.emptyStands(...args),
        };

        if (!methods[method]) {
          reject(new Error('La operación solicitada no existe.'));
          return;
        }
        methods[method]();
      });
    }

    elements.selectFromPhotoButton.addEventListener('click', selectActivePhotoStand);
    elements.confirmVoteButton.addEventListener('click', openVoteConfirmation);
    elements.submitVoteButton.addEventListener('click', submitVote);
    elements.cancelVoteButton.addEventListener('click', () => elements.confirmVoteDialog.close());
    document.querySelector('#adminButton').addEventListener('click', openAdminDialog);
    elements.pinForm.addEventListener('submit', submitAdminPin);
    elements.openVotingButton.addEventListener('click', () => changeVotingStatus('open'));
    elements.closeVotingButton.addEventListener('click', () => changeVotingStatus('closed'));
    elements.openingTimeForm.addEventListener('submit', saveOpeningTime);
    elements.resetVotingButton.addEventListener('click', () => openDangerConfirmation('resetVoting'));
    elements.emptyStandsButton.addEventListener('click', () => openDangerConfirmation('emptyStands'));
    elements.adminLogoutButton.addEventListener('click', logoutAdmin);
    elements.dangerForm.addEventListener('submit', confirmDangerAction);
    elements.cancelDangerButton.addEventListener('click', () => elements.dangerDialog.close());

    document.querySelectorAll('[data-close-dialog]').forEach((button) => {
      button.addEventListener('click', () => button.closest('dialog').close());
    });

    [
      elements.photoDialog,
      elements.confirmVoteDialog,
      elements.adminDialog,
      elements.dangerDialog,
    ].forEach((dialog) => {
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) dialog.close();
      });
    });

    renderApp();
  })();
</script>
