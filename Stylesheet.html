<style>
  :root {
    --ink: #172521;
    --muted: #63706c;
    --paper: #f7f4ed;
    --surface: #fffdf8;
    --line: #dedbd2;
    --accent: #f15b3f;
    --accent-dark: #cf3f28;
    --green: #174c3c;
    --green-soft: #dcebe3;
    --yellow: #f2c14e;
    --shadow: 0 18px 50px rgba(23, 37, 33, 0.1);
    --radius-lg: 28px;
    --radius-md: 18px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-width: 320px;
    margin: 0;
    color: var(--ink);
    background: var(--paper);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input {
    font: inherit;
  }

  button {
    color: inherit;
  }

  button:focus-visible,
  input:focus-visible,
  a:focus-visible {
    outline: 3px solid rgba(241, 91, 63, 0.35);
    outline-offset: 3px;
  }

  .site-header {
    position: sticky;
    z-index: 10;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 78px;
    padding: 14px clamp(20px, 5vw, 72px);
    border-bottom: 1px solid rgba(23, 37, 33, 0.1);
    background: rgba(247, 244, 237, 0.9);
    backdrop-filter: blur(14px);
  }

  .brand {
    display: inline-flex;
    gap: 12px;
    align-items: center;
    color: inherit;
    text-decoration: none;
  }

  .brand__mark {
    display: grid;
    width: 44px;
    height: 44px;
    place-items: center;
    border-radius: 14px;
    background: var(--green);
  }

  .brand__mark svg {
    width: 24px;
    fill: var(--yellow);
  }

  .brand strong,
  .brand small {
    display: block;
  }

  .brand strong {
    font-size: 0.96rem;
    letter-spacing: -0.01em;
  }

  .brand small {
    margin-top: 2px;
    color: var(--muted);
    font-size: 0.76rem;
  }

  .button {
    display: inline-flex;
    min-height: 44px;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 18px;
    border: 1px solid transparent;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 750;
    transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
  }

  .button:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  .button--quiet {
    border-color: var(--line);
    background: rgba(255, 255, 255, 0.55);
  }

  .button--primary,
  .button--vote {
    color: white;
    background: var(--accent);
  }

  .button--primary:hover:not(:disabled),
  .button--vote:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  .hero {
    position: relative;
    display: grid;
    min-height: 480px;
    overflow: hidden;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr);
    align-items: center;
    gap: clamp(28px, 6vw, 90px);
    padding: clamp(54px, 8vw, 112px) clamp(20px, 8vw, 120px);
    color: white;
    background: var(--green);
  }

  .hero::before {
    position: absolute;
    width: 430px;
    height: 430px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 50%;
    content: "";
    inset: -190px auto auto 38%;
  }

  .hero__content {
    position: relative;
    z-index: 1;
    max-width: 720px;
  }

  .eyebrow {
    margin: 0 0 10px;
    color: var(--accent);
    font-size: 0.73rem;
    font-weight: 850;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .hero .eyebrow {
    color: var(--yellow);
  }

  h1,
  h2,
  h3,
  p {
    overflow-wrap: anywhere;
  }

  h1,
  h2,
  h3 {
    margin-top: 0;
    letter-spacing: -0.04em;
  }

  h1 {
    max-width: 760px;
    margin-bottom: 22px;
    font-size: clamp(3rem, 8vw, 6.8rem);
    line-height: 0.93;
  }

  .hero__intro {
    max-width: 610px;
    margin: 0;
    color: rgba(255, 255, 255, 0.73);
    font-size: clamp(1rem, 2vw, 1.2rem);
    line-height: 1.7;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 32px;
    padding: 11px 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    font-size: 0.88rem;
    font-weight: 700;
  }

  .status__dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 0 5px rgba(242, 193, 78, 0.14);
  }

  .status[data-status="open"] .status__dot {
    background: #67db9b;
    box-shadow: 0 0 0 5px rgba(103, 219, 155, 0.14);
    animation: pulse 1.8s infinite;
  }

  .status[data-status="closed"] .status__dot {
    background: #c1c8c5;
    box-shadow: none;
  }

  .hero__shape {
    position: relative;
    display: grid;
    width: min(34vw, 400px);
    aspect-ratio: 1;
    justify-self: center;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 50%;
  }

  .hero__shape::before,
  .hero__shape::after {
    position: absolute;
    border-radius: 50%;
    content: "";
  }

  .hero__shape::before {
    width: 66%;
    height: 66%;
    background: var(--yellow);
  }

  .hero__shape::after {
    width: 34%;
    height: 34%;
    background: var(--accent);
  }

  .hero__shape span {
    position: absolute;
    z-index: 2;
    font-size: clamp(0.68rem, 1vw, 0.8rem);
    font-weight: 850;
    letter-spacing: 0.12em;
  }

  .hero__shape span:nth-child(1) {
    top: 9%;
  }

  .hero__shape span:nth-child(2) {
    right: 3%;
  }

  .hero__shape span:nth-child(3) {
    bottom: 10%;
  }

  .stands-section {
    padding: clamp(62px, 8vw, 110px) clamp(20px, 7vw, 108px);
  }

  .section-heading {
    display: flex;
    max-width: 1400px;
    align-items: end;
    justify-content: space-between;
    gap: 20px;
    margin: 0 auto 34px;
  }

  .section-heading h2 {
    margin-bottom: 0;
    font-size: clamp(2rem, 4vw, 3.5rem);
  }

  .section-heading > p {
    margin: 0 0 7px;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 700;
  }

  .stand-grid {
    display: grid;
    max-width: 1400px;
    margin: 0 auto;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(18px, 2.5vw, 34px);
  }

  .stand-card {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: 0 1px 0 rgba(23, 37, 33, 0.03);
    transition: transform 200ms ease, box-shadow 200ms ease;
  }

  .stand-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow);
  }

  .stand-card__media {
    position: relative;
    display: grid;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    padding: 0;
    border: 0;
    cursor: zoom-in;
    place-items: center;
    background: linear-gradient(135deg, #f2c14e, #f58e62);
  }

  .stand-card:nth-child(3n + 2) .stand-card__media {
    background: linear-gradient(135deg, #8fc7b5, #286854);
  }

  .stand-card:nth-child(3n + 3) .stand-card__media {
    background: linear-gradient(135deg, #9db7d7, #586ca3);
  }

  .stand-card__media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 260ms ease;
  }

  .stand-card__media:hover img {
    transform: scale(1.035);
  }

  .stand-card__number {
    color: rgba(255, 255, 255, 0.82);
    font-size: clamp(4rem, 8vw, 7rem);
    font-weight: 900;
    letter-spacing: -0.08em;
  }

  .stand-card__zoom {
    position: absolute;
    right: 14px;
    bottom: 14px;
    padding: 8px 11px;
    border-radius: 999px;
    color: white;
    background: rgba(23, 37, 33, 0.78);
    font-size: 0.75rem;
    font-weight: 700;
    backdrop-filter: blur(6px);
  }

  .stand-card__content {
    display: flex;
    min-height: 258px;
    flex-direction: column;
    justify-content: space-between;
    gap: 24px;
    padding: 24px;
  }

  .stand-card__label {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 850;
    letter-spacing: 0.13em;
    text-transform: uppercase;
  }

  .stand-card__title {
    margin-bottom: 10px;
    font-size: 1.6rem;
  }

  .stand-card__description {
    margin: 0;
    color: var(--muted);
    line-height: 1.55;
  }

  .button--vote {
    width: 100%;
    justify-content: space-between;
    border-radius: 14px;
  }

  .button--vote:disabled {
    cursor: not-allowed;
    color: #7c8582;
    background: #e7e5df;
  }

  .empty-state {
    max-width: 680px;
    margin: 0 auto;
    padding: 55px 24px;
    border: 1px dashed #b8beb9;
    border-radius: var(--radius-lg);
    text-align: center;
  }

  .empty-state__icon {
    display: grid;
    width: 54px;
    height: 54px;
    margin: 0 auto 18px;
    place-items: center;
    border-radius: 50%;
    color: white;
    background: var(--green);
    font-size: 1.8rem;
  }

  .empty-state h3 {
    margin-bottom: 8px;
    font-size: 1.5rem;
  }

  .empty-state p {
    margin: 0;
    color: var(--muted);
  }

  .site-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 30px clamp(20px, 7vw, 108px);
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.86rem;
  }

  .site-footer p {
    margin: 0;
  }

  .text-button {
    padding: 0;
    border: 0;
    border-bottom: 1px solid currentColor;
    cursor: pointer;
    color: var(--green);
    background: transparent;
    font-weight: 750;
  }

  .dialog {
    width: min(920px, calc(100% - 30px));
    max-height: calc(100vh - 30px);
    overflow: auto;
    padding: 0;
    border: 0;
    border-radius: var(--radius-lg);
    color: var(--ink);
    background: var(--surface);
    box-shadow: 0 26px 90px rgba(0, 0, 0, 0.35);
  }

  .dialog::backdrop {
    background: rgba(8, 23, 18, 0.72);
    backdrop-filter: blur(5px);
  }

  .dialog--small {
    width: min(480px, calc(100% - 30px));
  }

  .dialog__close {
    position: absolute;
    z-index: 2;
    top: 14px;
    right: 14px;
    display: grid;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid rgba(23, 37, 33, 0.12);
    border-radius: 50%;
    cursor: pointer;
    place-items: center;
    background: rgba(255, 255, 255, 0.9);
    font-size: 1.6rem;
  }

  .dialog__media {
    display: grid;
    min-height: 300px;
    max-height: 62vh;
    place-items: center;
    background: linear-gradient(135deg, #f2c14e, #f58e62);
  }

  .dialog__media img {
    width: 100%;
    max-height: 62vh;
    object-fit: contain;
  }

  .dialog__media span {
    color: rgba(255, 255, 255, 0.84);
    font-size: clamp(5rem, 18vw, 10rem);
    font-weight: 900;
    letter-spacing: -0.08em;
  }

  .dialog__body {
    padding: clamp(28px, 5vw, 48px);
  }

  .dialog__body h2 {
    margin-bottom: 12px;
    font-size: clamp(1.9rem, 4vw, 3rem);
  }

  .dialog__body > p:last-of-type {
    margin-bottom: 0;
    color: var(--muted);
    line-height: 1.6;
  }

  .pin-form {
    display: grid;
    gap: 12px;
    margin-top: 28px;
  }

  .pin-form label {
    font-size: 0.82rem;
    font-weight: 800;
  }

  .pin-form input {
    width: 100%;
    min-height: 52px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    background: white;
    font-size: 1.15rem;
    letter-spacing: 0.16em;
  }

  .pin-form .button {
    margin-top: 6px;
    border-radius: 12px;
  }

  .form-message {
    min-height: 1.4em;
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.82rem;
  }

  @keyframes pulse {
    50% {
      box-shadow: 0 0 0 8px rgba(103, 219, 155, 0);
    }
  }

  @media (max-width: 920px) {
    .hero {
      min-height: auto;
      grid-template-columns: 1fr;
    }

    .hero__shape {
      display: none;
    }

    .stand-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 620px) {
    .site-header {
      min-height: 68px;
    }

    .brand small {
      display: none;
    }

    .brand__mark {
      width: 40px;
      height: 40px;
    }

    .button--quiet {
      min-height: 40px;
      padding-inline: 14px;
      font-size: 0.82rem;
    }

    .hero {
      padding-top: 66px;
      padding-bottom: 66px;
    }

    .stand-grid {
      grid-template-columns: 1fr;
    }

    .section-heading,
    .site-footer {
      align-items: flex-start;
      flex-direction: column;
    }

    .section-heading > p {
      margin: 0;
    }

    .stand-card__content {
      min-height: 230px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
